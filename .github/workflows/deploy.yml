name: CI Checks

# 纯 CI 文件 — 只跑 frontend tsc/build + backend tests,不部署
# 部署逻辑拆到:
#   - .github/workflows/deploy-uat.yml  (push main 自动)
#   - .github/workflows/deploy-prod.yml (workflow_dispatch 手动)
# PR / 非 main 分支推送也走这里,验证后再合 main
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'LEARNING.md'
      - 'PROJECT_OVERVIEW.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'task.md'
      - 'backend/services/agentic/skills_roadmap.md'
      - '.gitignore'
      - 'desktop/**'
      - 'edge/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'LEARNING.md'
      - 'PROJECT_OVERVIEW.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'task.md'
      - 'backend/services/agentic/skills_roadmap.md'
      - '.gitignore'
      - 'desktop/**'
      - 'edge/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  frontend-check:
    name: Frontend tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Type check
        run: cd frontend && npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: cd frontend && npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kb_system
          POSTGRES_USER: kb_admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # meeting 后端代码在 meeting/backend/,非 Docker 的 CI job 需手动 overlay。
      # 前端已于 2026-07-29 合回 frontend/,不再有 overlay。
      - name: Overlay meeting/backend
        run: cp -r meeting/backend/. backend/

      # MinIO 镜像换了两次,别再往回改:
      #   2026-09-22 Docker Hub `minio/minio` 被删(MinIO 于 2025-10-23 停发社区版)→ 改 quay.io
      #   2026-09-29 quay.io 也被清空(401)→ 改 cgr.dev/chainguard/minio
      # 两次都是 HTTP 401 = 仓库不存在,**不是**限流也不是凭证问题,登录/重试都不会恢复。
      # 判断方法:拿一个肯定还在的仓库(如 quay.io/prometheus/node-exporter)跑同样的查询自检。
      #
      # ⚠️ 这一步跑在 GitHub 的 runner 上,**不碰生产服务器** —— 所以只需 runner 能拉到镜像,
      # 与「服务器能不能拉 cgr.dev」无关。Chainguard 镜像已实测兼容:
      #   Entrypoint = /usr/bin/minio  → `server /data` 用法一字不改
      #   /data 存在且 mode=0777       → 以非 root(65532)运行也能写
      # ⚠️ 生产 docker-compose.yml **仍指向 quay.io**(那个引用已经拉不到了),是**故意没动**的:
      # Chainguard 是 distroless + 非 root,与存量 root 属主卷 / healthcheck 的 curl /
      # 备份脚本的 tar 三处不兼容,要配维护窗口单独做。详见 LEARNING.md §31。
      - name: Start MinIO manually
        run: |
          docker run -d -p 9000:9000 -p 9001:9001 --name minio \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            cgr.dev/chainguard/minio server /data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up Environment Variables
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_DB=kb_system" >> $GITHUB_ENV
          echo "POSTGRES_USER=kb_admin" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
          echo "QDRANT_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "MINIO_ENDPOINT=localhost:9000" >> $GITHUB_ENV
          echo "MINIO_USER=minioadmin" >> $GITHUB_ENV
          echo "MINIO_PASSWORD=minioadmin" >> $GITHUB_ENV
          echo "MINIO_BUCKET=kb-documents" >> $GITHUB_ENV
          echo "EMBEDDING_API_KEY=dummy" >> $GITHUB_ENV
          echo "RERANK_API_KEY=dummy" >> $GITHUB_ENV
          echo "ZHIPU_API_KEY=dummy" >> $GITHUB_ENV
          echo "MINIMAX_API_KEY=dummy" >> $GITHUB_ENV
          # 2026-05-12:main.py 启动时校验 JWT_SECRET_KEY 非默认值,CI 给个一次性随机值即可
          echo "JWT_SECRET_KEY=ci-test-$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "KB_ENV=development" >> $GITHUB_ENV

      - name: Initialize Infrastructure
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          python scripts/init_db.py
          python scripts/init_qdrant.py
          python scripts/init_minio.py

      - name: Start API Service in background
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          cd backend && uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests/test_phase0.py -v
