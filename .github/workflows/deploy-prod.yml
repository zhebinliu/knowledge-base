name: Deploy PROD

# 生产部署:
#   - 仅手动触发(workflow_dispatch),避免误推 main 把 prod 改了
#   - 条件构建(2026-07-14):对比上次部署的 prod-live tag,只构建 / 重启变更的服务
#     (backend / frontend / edge);单边改动省构建时间。
#   - 2026-09-24 起:不再走 ghcr。源码 rsync 到服务器 /opt/kb-build,服务器用腾讯云内网源自己 build
#     (新机拉 ghcr 只有 ~76KB/s),镜像只存本机 kb-*:sha-xxx,保留本次+上一版供回滚
#   - 完整操作指南:docs/部署指南.md
#   - SSH 部署:滚动重启(maintenance flag + 健康检查 + 回滚)
#   - 目标机:腾讯云南京 175.27.231.228(ubuntu),2026-09 从 GCP 34.42.241.99 迁来
#   - 影响域名:kb/skillhub/aihub.sharewb.cloud(tokenwave.cloud 未备案,在新机上被腾讯拦截)
#   - docker-compose.yml 随源码同步到 /opt/kb-build,部署时拷到 /opt/kb-system(旧版备份 .prev)
#   - edge(80/443 入口)只在 edge/ 或 docker-compose.yml 变更时才重建 —— 那是唯一
#     会闪断 aihub/skillhub/kanban/studio 的场景;日常前后端部署不碰 edge
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '部署到生产 kb.sharewb.cloud(腾讯云新机),确认请填 "deploy"'
        required: true
        type: string
      force_all:
        description: '强制全量构建(backend+frontend+edge,忽略变更检测),填 "yes" 开启'
        required: false
        type: string
        default: ''

jobs:
  guard:
    name: Confirm input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirm string
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "❌ 必须填 'deploy' 才能触发,当前是 '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "✅ Confirmed: deploying to PROD"

  changes:
    name: Detect changed services
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Diff against last prod-live tag
        id: filter
        run: |
          # 强制全量
          if [ "${{ inputs.force_all }}" = "yes" ]; then
            echo "→ force_all=yes,全量构建"
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "edge=true"     >> $GITHUB_OUTPUT
            exit 0
          fi
          # 取上次部署基准(prod-live tag)
          git fetch origin 'refs/tags/prod-live:refs/tags/prod-live' 2>/dev/null || true
          if git rev-parse prod-live >/dev/null 2>&1; then
            BASE=$(git rev-parse prod-live)
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then
            echo "→ 无 prod-live 基准(首次),全量构建"
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "edge=true"     >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "→ 对比基准 $BASE .. HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD || echo "")
          echo "$CHANGED"
          BE=false; FE=false; ED=false
          echo "$CHANGED" | grep -qE '^(backend/|meeting/backend/|docker-compose\.yml)' && BE=true || true
          echo "$CHANGED" | grep -qE '^frontend/' && FE=true || true
          # edge = 80/443 入口,重建会闪断全部域名(含 aihub/skillhub)—— 只在
          # edge/ 或 docker-compose.yml(服务定义)变更时才动它
          echo "$CHANGED" | grep -qE '^(edge/|docker-compose\.yml)' && ED=true || true
          # 兜底:没匹配到任何一边(如只改 .github / 文档)→ backend+frontend 都建;
          # edge 不进兜底 —— 宁可漏也不无谓闪断其它站点
          if [ "$BE" = "false" ] && [ "$FE" = "false" ] && [ "$ED" = "false" ]; then BE=true; FE=true; fi
          echo "→ backend=$BE frontend=$FE edge=$ED"
          echo "backend=$BE"  >> $GITHUB_OUTPUT
          echo "frontend=$FE" >> $GITHUB_OUTPUT
          echo "edge=$ED"     >> $GITHUB_OUTPUT

  test:
    name: Run Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kb_system
          POSTGRES_USER: kb_admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v6

      # meeting 后端代码在 meeting/backend/,非 Docker 的 CI job 需手动 overlay
      - name: Overlay meeting/backend
        run: cp -r meeting/backend/. backend/

      # 2026-09-22:镜像源从 Docker Hub 改到 quay.io —— MinIO 已于 2025-10-23 停止在
      # Docker Hub 免费分发社区版镜像,`minio/minio` 仓库被整体删除,拉取会直接报
      # "pull access denied ... repository does not exist"(HTTP 401,不是限流/凭证问题,
      # 登录或重试都不会恢复)。quay.io 上同名同 tag 的镜像仍在,`server /data` 用法不变。
      # 本地 docker-compose.yml / kanban/docker-compose.yml 用的是同一个镜像,需同步。
      - name: Start MinIO manually
        run: |
          docker run -d -p 9000:9000 -p 9001:9001 --name minio \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            quay.io/minio/minio server /data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up Environment Variables
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_DB=kb_system" >> $GITHUB_ENV
          echo "POSTGRES_USER=kb_admin" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
          echo "QDRANT_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "MINIO_ENDPOINT=localhost:9000" >> $GITHUB_ENV
          echo "MINIO_USER=minioadmin" >> $GITHUB_ENV
          echo "MINIO_PASSWORD=minioadmin" >> $GITHUB_ENV
          echo "MINIO_BUCKET=kb-documents" >> $GITHUB_ENV
          echo "EMBEDDING_API_KEY=dummy" >> $GITHUB_ENV
          echo "RERANK_API_KEY=dummy" >> $GITHUB_ENV
          echo "ZHIPU_API_KEY=dummy" >> $GITHUB_ENV
          echo "MINIMAX_API_KEY=dummy" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "KB_ENV=development" >> $GITHUB_ENV

      - name: Initialize Infrastructure
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          python scripts/init_db.py
          python scripts/init_qdrant.py
          python scripts/init_minio.py

      - name: Start API Service in background
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          cd backend && uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests/test_phase0.py -v

  frontend-check:
    name: Frontend tsc + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npx tsc --noEmit -p tsconfig.json
      - run: cd frontend && npm run build

  deploy:
    name: Deploy PROD to server
    needs: [changes, test, frontend-check]
    # 变更检测成功 + 测试/前端检查都没失败(可能被 skip)才部署
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.test.result != 'failure'
      && needs.test.result != 'cancelled'
      && needs.frontend-check.result != 'failure'
      && needs.frontend-check.result != 'cancelled'
    runs-on: ubuntu-latest
    # 同一时间只允许一个 PROD 部署(2026-09-24 两个 run 并发抢同一台机器,险些把旧 edge 部署上去)
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write   # 部署成功后推 prod-live tag

    steps:
      - uses: actions/checkout@v6

      - name: Compute short SHA
        id: sha
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # ── 1. 源码增量同步到服务器 /opt/kb-build ──────────────────────────────
      # 新机(腾讯云南京)连不上 github、拉 ghcr 只有 ~76KB/s,所以不走镜像仓库:
      # 只把 build 需要的源码 rsync 过去(--checksum:内容没变的文件一个字节都不传,
      # frontend/public 里 100MB+ 的课程音频平时不会重复传),由服务器自己 build。
      - name: Sync source to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 30 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30"
          $SSH "$USER@$HOST" 'sudo mkdir -p /opt/kb-build && sudo chown $(id -u):$(id -g) /opt/kb-build'
          time rsync -azR --checksum --delete --stats -e "$SSH" \
            --exclude node_modules/ --exclude dist/ --exclude __pycache__/ --exclude '*.pyc' \
            ./backend ./meeting ./frontend ./edge ./docker-compose.yml ./.dockerignore \
            "$USER@$HOST:/opt/kb-build/" | grep -E 'Number of (regular )?files transferred|Total transferred file size|sent .* bytes'
          echo "${GITHUB_SHA}" | $SSH "$USER@$HOST" 'cat > /opt/kb-build/.sha'

      # ── 2. 服务器上 build + 滚动切换 ────────────────────────────────────────
      - name: Build & deploy on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          FERNET_KEY_SECRET: ${{ secrets.FERNET_KEY }}
          DEPLOY_BE: ${{ needs.changes.outputs.backend }}
          DEPLOY_FE: ${{ needs.changes.outputs.frontend }}
          DEPLOY_ED: ${{ needs.changes.outputs.edge }}
          FULL_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ steps.sha.outputs.value }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          # 服务器 build(首次 backend 含 libreoffice 约 10min,之后吃缓存 1-3min)+ celery_worker
          # 优雅 drain(最长 30min)。给足 60min,避免 SSH 会话中途被切断。
          command_timeout: 60m
          envs: FERNET_KEY_SECRET,DEPLOY_BE,DEPLOY_FE,DEPLOY_ED,FULL_SHA,SHORT_SHA
          script: |
            set -o pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            SRC=/opt/kb-build

            if [ "$(cat $SRC/.sha 2>/dev/null)" != "$FULL_SHA" ]; then
              echo "❌ /opt/kb-build 的源码版本($(cat $SRC/.sha 2>/dev/null))≠ 本次 $FULL_SHA,可能有别的部署在并发同步,中止"
              exit 1
            fi

            # compose 服务定义以仓库为准(服务器专属改动放 docker-compose.override.yml,不受影响)
            if ! cmp -s $SRC/docker-compose.yml docker-compose.yml; then
              sudo cp docker-compose.yml docker-compose.yml.prev
              sudo cp $SRC/docker-compose.yml docker-compose.yml
              echo "→ docker-compose.yml 已更新(旧版备份 docker-compose.yml.prev)"
            fi

            if [ -n "$FERNET_KEY_SECRET" ] && ! grep -q '^FERNET_KEY=' .env 2>/dev/null; then
              echo "FERNET_KEY=$FERNET_KEY_SECRET" >> .env
              echo "→ FERNET_KEY 首次写入 .env(从 GitHub Secrets 恢复)"
            fi

            # 镜像只存在本机,tag 带 sha 便于回滚;成功后再打 :latest
            BACKEND_IMAGE_FULL="kb-backend:sha-${SHORT_SHA}"
            FRONTEND_IMAGE_FULL="kb-frontend-prod:sha-${SHORT_SHA}"
            EDGE_IMAGE_FULL="kb-edge:sha-${SHORT_SHA}"
            echo "→ 本次部署 backend=${DEPLOY_BE} frontend=${DEPLOY_FE} edge=${DEPLOY_ED}"

            UP_SVCS=""
            [ "$DEPLOY_BE" = "true" ] && UP_SVCS="$UP_SVCS backend"
            [ "$DEPLOY_FE" = "true" ] && UP_SVCS="$UP_SVCS frontend"
            if [ -z "$UP_SVCS" ] && [ "$DEPLOY_ED" != "true" ]; then
              echo "⚠️ 无变更服务,跳过"
              exit 0
            fi

            # ── build(此时线上仍是旧版本,站点不受影响)──
            # 腾讯云内网镜像源:apt / PyPI / npm;基础镜像走 daemon.json 里的 Docker Hub 镜像加速
            MIRROR=http://mirrors.tencentyun.com
            df -h / | tail -1
            if [ "$DEPLOY_BE" = "true" ]; then
              echo "→ build backend"
              sudo docker build -f $SRC/backend/Dockerfile \
                --build-arg APT_MIRROR=$MIRROR \
                --build-arg PIP_MIRROR=https://mirrors.tencentyun.com/pypi/simple \
                -t "$BACKEND_IMAGE_FULL" $SRC 2>&1 | tail -5 || { echo "❌ backend build 失败,线上未改动"; exit 1; }
            fi
            if [ "$DEPLOY_FE" = "true" ]; then
              echo "→ build frontend"
              sudo docker build -f $SRC/frontend/Dockerfile \
                --build-arg ENV=prod --build-arg GIT_SHA=$FULL_SHA \
                --build-arg NPM_REGISTRY=$MIRROR/npm/ \
                -t "$FRONTEND_IMAGE_FULL" $SRC 2>&1 | tail -5 || { echo "❌ frontend build 失败,线上未改动"; exit 1; }
            fi
            if [ "$DEPLOY_ED" = "true" ]; then
              echo "→ build edge"
              sudo docker build -f $SRC/edge/Dockerfile -t "$EDGE_IMAGE_FULL" $SRC 2>&1 | tail -5 \
                || { echo "❌ edge build 失败,线上未改动"; exit 1; }
              # edge 是全站 80/443 入口:先用真证书目录做一次 nginx -t,不过就不上
              sudo docker run --rm -v /etc/letsencrypt:/etc/letsencrypt:ro --entrypoint sh "$EDGE_IMAGE_FULL" \
                -c 'sed "s/^exec nginx.*//" /entrypoint.sh > /tmp/t.sh && sh /tmp/t.sh' \
                || { echo "❌ 新 edge 配置 nginx -t 不通过,线上未改动"; exit 1; }
            fi

            # ── 切换 ──
            # 回滚锚点:把「切换前正在跑的镜像」打成 :prev。回滚直接用它,不依赖某个 sha tag 是否存在
            # (上次部署没重建的服务本来就没有对应 sha 的镜像)
            [ "$DEPLOY_BE" = "true" ] && sudo docker tag "$(sudo docker inspect kb-system-backend-1 --format '{{.Image}}')"  kb-backend:prev
            [ "$DEPLOY_FE" = "true" ] && sudo docker tag "$(sudo docker inspect kb-system-frontend-1 --format '{{.Image}}')" kb-frontend-prod:prev
            [ "$DEPLOY_ED" = "true" ] && sudo docker tag "$(sudo docker inspect kb-system-edge-1 --format '{{.Image}}')"     kb-edge:prev
            if [ -f .last-good-sha ]; then cp .last-good-sha .prev-good-sha; fi
            sudo mkdir -p /opt/kb-system/run
            sudo touch /opt/kb-system/run/.maintenance

            if [ -n "$UP_SVCS" ]; then
              sudo BACKEND_IMAGE="${BACKEND_IMAGE_FULL}" FRONTEND_IMAGE="${FRONTEND_IMAGE_FULL}" EDGE_IMAGE="${EDGE_IMAGE_FULL}" \
                docker compose up -d --no-deps $UP_SVCS
            fi
            if [ "$DEPLOY_ED" = "true" ]; then
              sudo BACKEND_IMAGE="${BACKEND_IMAGE_FULL}" FRONTEND_IMAGE="${FRONTEND_IMAGE_FULL}" EDGE_IMAGE="${EDGE_IMAGE_FULL}" \
                docker compose up -d --no-deps edge
            fi

            sleep 3
            ALIGN_OK=true
            if [ "$DEPLOY_BE" = "true" ]; then
              BE_IMAGE=$(sudo docker inspect kb-system-backend-1 --format '{{.Config.Image}}' 2>/dev/null || echo "")
              if [ "$BE_IMAGE" != "$BACKEND_IMAGE_FULL" ]; then
                echo "❌ backend 对齐失败:预期=$BACKEND_IMAGE_FULL 实际=$BE_IMAGE"; ALIGN_OK=false
              fi
            fi
            if [ "$DEPLOY_FE" = "true" ]; then
              FE_IMAGE=$(sudo docker inspect kb-system-frontend-1 --format '{{.Config.Image}}' 2>/dev/null || echo "")
              if [ "$FE_IMAGE" != "$FRONTEND_IMAGE_FULL" ]; then
                echo "❌ frontend 对齐失败:预期=$FRONTEND_IMAGE_FULL 实际=$FE_IMAGE"; ALIGN_OK=false
              fi
            fi
            if [ "$DEPLOY_ED" = "true" ]; then
              ED_IMAGE=$(sudo docker inspect kb-system-edge-1 --format '{{.Config.Image}}' 2>/dev/null || echo "")
              if [ "$ED_IMAGE" != "$EDGE_IMAGE_FULL" ]; then
                echo "❌ edge 对齐失败:预期=$EDGE_IMAGE_FULL 实际=$ED_IMAGE"; ALIGN_OK=false
              fi
            fi
            if [ "$ALIGN_OK" != "true" ]; then
              sudo rm -f /opt/kb-system/run/.maintenance; exit 1
            fi
            echo "✓ 容器 image 已对齐"

            # edge 部署时:验证 80/443 入口活着(host 直接 curl :80,穿透端口绑定)
            if [ "$DEPLOY_ED" = "true" ]; then
              EDGE_OK=false
              for i in $(seq 1 6); do
                if curl -fsS http://127.0.0.1/health 2>/dev/null | grep -q ok; then
                  EDGE_OK=true; echo "✅ edge healthy after $((i*5))s"; break
                fi
                sleep 5
              done
              if [ "$EDGE_OK" != "true" ]; then
                echo "❌ edge 健康检查失败(80/443 入口不通,影响全部域名!)"
                sudo docker compose logs --tail 50 edge || true
                sudo rm -f /opt/kb-system/run/.maintenance
                exit 1
              fi
            fi

            HEALTHY=false
            for i in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
                HEALTHY=true; echo "✅ Healthy after $((i*5))s"; break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "$SHORT_SHA" > .last-good-sha
              [ "$DEPLOY_BE" = "true" ] && sudo docker tag "$BACKEND_IMAGE_FULL"  kb-backend:latest       || true
              [ "$DEPLOY_FE" = "true" ] && sudo docker tag "$FRONTEND_IMAGE_FULL" kb-frontend-prod:latest || true
              [ "$DEPLOY_ED" = "true" ] && sudo docker tag "$EDGE_IMAGE_FULL"     kb-edge:latest          || true
              sudo rm -f /opt/kb-system/run/.maintenance
              # backend 容器重建后 IP 会变;前端 nginx 用静态 proxy_pass http://backend:8000,
              # 只在启动时解析一次 —— 不 reload 就会一直连旧 IP,/api 全 502 导致登录不了。
              # DEPLOY_FE=true 时前端容器已重建(启动即重新解析),这里 reload 冗余但无害。
              if [ "$DEPLOY_BE" = "true" ]; then
                echo "→ backend 已重建,reload 前端 nginx 重新解析 backend upstream"
                sudo docker exec kb-system-frontend-1 nginx -s reload 2>&1 || true
                sudo docker exec kb-system-frontend-uat-1 nginx -s reload 2>&1 || true
              fi
              # ── celery_worker 优雅重建(最后一步,此时 backend 已 live、维护页已清)──
              # docker stop 发 SIGTERM → worker 停止取新任务、把手上在跑的任务跑完再退
              # (stop_grace_period=30min,见 docker-compose.yml)→ 再换新镜像。
              # 空闲时秒换;有任务在跑时在此静默等 drain(command_timeout=60min 覆盖),
              # 期间站点/后端已正常、不受影响,也不打断在跑的转写/生成任务。
              if [ "$DEPLOY_BE" = "true" ]; then
                echo "→ 优雅重建 celery_worker(等在跑任务 drain,最长 30min;空闲则秒换)"
                sudo BACKEND_IMAGE="${BACKEND_IMAGE_FULL}" FRONTEND_IMAGE="${FRONTEND_IMAGE_FULL}" EDGE_IMAGE="${EDGE_IMAGE_FULL}" \
                  docker compose up -d --no-deps celery_worker || echo "⚠️ celery_worker 重建返回非0(不影响已 live 的 backend,需人工核查 worker)"
                WK_IMAGE=$(sudo docker inspect kb-system-celery_worker-1 --format '{{.Config.Image}}' 2>/dev/null || echo "")
                [ "$WK_IMAGE" = "$BACKEND_IMAGE_FULL" ] && echo "✓ celery_worker 已对齐 $WK_IMAGE" || echo "⚠️ celery_worker image 未对齐:实际=$WK_IMAGE 预期=$BACKEND_IMAGE_FULL"
              fi
              echo "✅ PROD deployed sha-${SHORT_SHA}(be=$DEPLOY_BE fe=$DEPLOY_FE)"
              # 清理:每个镜像只留 :latest(=本次)+ :prev(上一版,手动回滚用);不再 prune -a
              # (会把回滚镜像和 python/node 基础镜像一起删掉,下次 build 全量重下)
              echo "→ 部署后清理旧镜像"
              for repo in kb-backend kb-frontend-prod kb-edge; do
                sudo docker images "$repo" --format '{{.Tag}}' | grep '^sha-' \
                  | grep -vx "sha-${SHORT_SHA}" \
                  | xargs -r -I{} sudo docker rmi "$repo:{}" >/dev/null 2>&1 || true
              done
              sudo docker image prune -f 2>&1 | tail -1 || true
              sudo docker builder prune -f --filter until=168h 2>&1 | tail -1 || true
              df -h / | tail -1
            else
              echo "❌ Health check failed after 120s for sha-${SHORT_SHA}"
              echo "--- backend logs ---"
              sudo docker compose logs --tail 50 backend || true
              if [ -n "$UP_SVCS" ]; then
                echo "回滚到 :prev(切换前的镜像;仅本次部署的服务:$UP_SVCS;edge 不自动回滚,失败需人工处理)"
                sudo BACKEND_IMAGE="kb-backend:prev" FRONTEND_IMAGE="kb-frontend-prod:prev" EDGE_IMAGE="kb-edge:prev" \
                  docker compose up -d --no-deps $UP_SVCS
                sleep 30
                # 回滚也重建了 backend → 同样要 reload 前端 nginx 重新解析 upstream
                if [ "$DEPLOY_BE" = "true" ]; then
                  sudo docker exec kb-system-frontend-1 nginx -s reload 2>&1 || true
                  sudo docker exec kb-system-frontend-uat-1 nginx -s reload 2>&1 || true
                fi
                sudo rm -f /opt/kb-system/run/.maintenance
              else
                echo "⚠️  本次只动了 edge,不自动回滚(edge 回滚见 docs/部署指南.md)"
                sudo rm -f /opt/kb-system/run/.maintenance
              fi
              exit 1
            fi

            sudo docker compose ps

      - name: Mark prod-live tag
        if: success()
        run: |
          git tag -f prod-live ${{ github.sha }}
          git push -f origin prod-live

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SHORT_SHA: ${{ steps.sha.outputs.value }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL 未配置,跳过通知"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"❌ KB PROD 部署失败 sha=${SHORT_SHA} ${COMMIT_MSG}\"}}" \
          || echo "webhook 通知失败"
